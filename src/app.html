<!doctype html>
<html
  lang="en"
  data-theme="pine"
>
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      href="%sveltekit.assets%/svelte-logo.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <!-- SvelteKit이 페이지별 메타 태그나 타이틀을 주입하는 자리 -->
    %sveltekit.head%
  </head>
  <body>
    <!-- Svelte 페이지 및 레이아웃 컴포넌트가 렌더링되는 자리 -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
